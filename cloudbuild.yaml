steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/trilliumfinance:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/trilliumfinance:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trilliumfinance'
      - '--image'
      - 'gcr.io/$PROJECT_ID/trilliumfinance:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Secrets from Secret Manager (example)
      # - '--set-secrets=FIREBASE_PRIVATE_KEY=trillium-firebase-key:latest'

images:
  - 'gcr.io/$PROJECT_ID/trilliumfinance:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
